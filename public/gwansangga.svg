<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-label="막걸리 한잔하며 나를 바라보는 관상가 — 민화풍 그림">
  <defs>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.33  0 0 0 0 0.2  0 0 0 0.09 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
    <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="2"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#d9826a" stop-opacity="0.55"/><stop offset="1" stop-color="#d9826a" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- 한지 바탕 -->
  <rect width="300" height="400" fill="#efe2c6"/>
  <rect width="300" height="400" fill="#efe2c6" filter="url(#paper)"/>

  <g filter="url(#ink)" stroke="#2b2118" stroke-linecap="round" stroke-linejoin="round">
    <!-- 해와 구름 -->
    <circle cx="242" cy="62" r="24" fill="#c8553d" stroke="none" opacity="0.85"/>
    <path d="M196 92 q10 -14 24 -6 q8 -12 22 -4 q14 -4 18 8 q12 2 8 12 h-70 q-10 -2 -2 -10z" fill="#f6efe0" stroke-width="1.6"/>
    <path d="M30 70 q8 -10 18 -4 q8 -10 18 -2 q10 0 10 8 h-44z" fill="#f6efe0" stroke-width="1.4"/>

    <!-- 소나무 -->
    <path d="M18 400 C 30 330 20 280 44 220 C 54 196 50 170 64 150" fill="none" stroke="#5b3a24" stroke-width="9"/>
    <path d="M44 222 c 20 -6 30 -2 40 -12" fill="none" stroke="#5b3a24" stroke-width="5"/>
    <g fill="#3f6e57" stroke="#24412f" stroke-width="1.2">
      <ellipse cx="66" cy="146" rx="30" ry="11"/>
      <ellipse cx="88" cy="206" rx="26" ry="9"/>
      <ellipse cx="34" cy="186" rx="22" ry="8"/>
    </g>

    <!-- 몸통: 흰 두루마기 -->
    <path d="M70 400 C 70 330 86 290 150 282 C 214 290 230 330 230 400 Z" fill="#f7f3ea" stroke-width="2.4"/>
    <!-- 옷깃(쪽빛) -->
    <path d="M150 284 L 124 360 M150 284 L 176 360" fill="none" stroke="#2f4a7a" stroke-width="7"/>
    <path d="M146 300 q 4 10 8 0" fill="none" stroke-width="1.6"/>
    <!-- 고름(붉은 끈) -->
    <path d="M152 330 q 14 6 18 26 M152 330 q 6 14 2 34" fill="none" stroke="#b23a2e" stroke-width="4"/>

    <!-- 왼팔(그림 오른쪽) — 무릎 위 -->
    <path d="M214 312 C 236 330 238 368 214 384 L 190 380 C 204 362 204 340 196 326" fill="#f7f3ea" stroke-width="2.2"/>

    <!-- 오른팔: 사발을 든 팔 -->
    <path d="M92 312 C 70 330 72 356 94 352 C 112 350 122 338 126 326" fill="#f7f3ea" stroke-width="2.2"/>
    <!-- 막걸리 사발 -->
    <path d="M104 318 q 22 12 44 0 q -2 18 -22 20 q -20 -2 -22 -20z" fill="#e8e1d0" stroke-width="2"/>
    <ellipse cx="126" cy="318" rx="22" ry="5" fill="#f4efe4" stroke-width="1.8"/>
    <ellipse cx="126" cy="318" rx="18" ry="3.4" fill="#e6dcc2" stroke="none"/>
    <path d="M110 326 q 16 6 32 0" fill="none" stroke="#2f4a7a" stroke-width="1.4"/>

    <!-- 사발을 받쳐 든 손: 손바닥이 아래를 받치고 엄지가 테두리에 걸침 -->
    <path d="M104 330 C 104 344 116 350 128 350 C 140 350 150 344 150 334 C 150 330 146 328 142 330 L 112 330 C 108 328 104 328 104 330 Z" fill="#e9c6a2" stroke-width="1.8"/>
    <path d="M114 342 q 6 4 12 4 M126 346 q 8 0 14 -4 M136 338 q 6 -1 10 -4" fill="none" stroke-width="1.1"/>
    <path d="M146 324 C 152 318 158 318 158 324 C 158 330 152 334 146 332" fill="#e9c6a2" stroke-width="1.8"/>
    <!-- 무릎 위에 얹은 왼손 -->
    <path d="M190 372 C 186 360 194 352 206 354 C 218 356 222 366 216 374 C 210 380 196 380 190 372 Z" fill="#e9c6a2" stroke-width="1.8"/>
    <path d="M196 362 q 6 -2 10 2 M198 368 q 6 -2 12 1 M200 374 q 5 -1 10 0" fill="none" stroke-width="1.1"/>

    <!-- 술병(호리병) -->
    <path d="M246 400 c -26 0 -30 -30 -16 -44 c 6 -6 4 -14 2 -18 c -2 -8 4 -12 10 -12 c 6 0 12 4 10 12 c -2 4 -4 12 2 18 c 14 14 10 44 -8 44z" fill="#d8c9a3" stroke-width="2"/>
    <path d="M236 326 h 12" stroke-width="3" stroke="#b23a2e"/>
    <path d="M232 370 q 14 6 28 0" fill="none" stroke="#2f4a7a" stroke-width="1.4"/>

    <!-- 목 -->
    <path d="M136 258 v 26 h 28 v -26" fill="#e9c6a2" stroke-width="1.8"/>

    <!-- 얼굴 -->
    <path d="M110 186 C 108 226 124 262 150 266 C 176 262 192 226 190 186 C 186 160 168 150 150 150 C 132 150 114 160 110 186 Z" fill="#edcfac" stroke-width="2.2"/>
    <ellipse cx="124" cy="226" rx="12" ry="7" fill="url(#cheek)" stroke="none"/>
    <ellipse cx="176" cy="226" rx="12" ry="7" fill="url(#cheek)" stroke="none"/>
    <!-- 귀 -->
    <path d="M110 200 q -10 0 -8 14 q 2 12 10 10" fill="#edcfac" stroke-width="1.8"/>
    <path d="M190 200 q 10 0 8 14 q -2 12 -10 10" fill="#edcfac" stroke-width="1.8"/>

    <!-- 눈썹(희끗) -->
    <path d="M122 194 q 10 -8 22 -2" fill="none" stroke="#6b6158" stroke-width="3.2"/>
    <path d="M156 192 q 12 -6 22 2" fill="none" stroke="#6b6158" stroke-width="3.2"/>
    <!-- 눈: 두 눈 모두 나를 본다 -->
    <path d="M123 208 q 10 -7 20 0 q -10 6 -20 0 z" fill="#fbf7ee" stroke-width="1.6"/>
    <path d="M157 208 q 10 -7 20 0 q -10 6 -20 0 z" fill="#fbf7ee" stroke-width="1.6"/>
    <circle cx="133" cy="207.6" r="3.2" fill="#2b2118" stroke="none"/>
    <circle cx="167" cy="207.6" r="3.2" fill="#2b2118" stroke="none"/>
    <circle cx="134" cy="206.4" r="0.9" fill="#fbf7ee" stroke="none"/>
    <circle cx="168" cy="206.4" r="0.9" fill="#fbf7ee" stroke="none"/>
    <!-- 윗눈꺼풀 선(지그시 웃는 눈매) -->
    <path d="M121 206 q 12 -9 24 -1" fill="none" stroke-width="2.2"/>
    <path d="M155 205 q 12 -8 24 1" fill="none" stroke-width="2.2"/>
    <!-- 눈가 웃음 주름 -->
    <path d="M180 205 l 5 -2 M180 209 l 5 2 M120 205 l -5 -2 M120 209 l -5 2" fill="none" stroke-width="1"/>

    <!-- 코 -->
    <path d="M150 210 q -4 18 -8 24 q 8 6 16 0" fill="none" stroke-width="1.8"/>
    <!-- 수염 -->
    <path d="M132 244 q 18 -8 36 0 q -8 6 -18 4 q -10 2 -18 -4z" fill="#d9d4cc" stroke-width="1.4"/>
    <path d="M136 252 C 138 286 148 300 150 304 C 152 300 162 286 164 252 C 158 258 142 258 136 252 Z" fill="#e4dfd6" stroke-width="1.6"/>
    <path d="M144 262 l 2 26 M150 262 v 32 M156 262 l -2 26" fill="none" stroke="#9c958a" stroke-width="1"/>
    <!-- 입: 슬쩍 웃음 -->
    <path d="M143 251 q 7 4 14 -1" fill="none" stroke="#9b3d2e" stroke-width="1.8"/>
    <!-- 붉어진 볼(한잔 했다) -->
    <path d="M118 222 l 4 -2 M120 226 l 4 -2 M176 222 l 4 -2 M178 226 l 4 -2" stroke="#c8553d" stroke-width="1.2"/>

    <!-- 망건·탕건 -->
    <path d="M112 182 q 38 -14 76 0 l -2 -10 q -36 -12 -72 0z" fill="#2b2118" stroke-width="1.6"/>
    <!-- 갓: 모자(대우) -->
    <path d="M124 172 L 128 118 Q 150 110 172 118 L 176 172 Z" fill="#1f1914" fill-opacity="0.82" stroke-width="2"/>
    <path d="M128 132 q 22 -6 44 0 M127 146 q 23 -6 46 0 M126 160 q 24 -6 48 0" fill="none" stroke="#5a4b3c" stroke-width="0.8"/>
    <!-- 갓: 양태(넓은 챙, 반투명 말총) -->
    <ellipse cx="150" cy="174" rx="84" ry="15" fill="#1f1914" fill-opacity="0.55" stroke-width="2.2"/>
    <ellipse cx="150" cy="174" rx="68" ry="10" fill="none" stroke="#5a4b3c" stroke-width="0.8"/>
    <!-- 갓끈 -->
    <path d="M112 182 q -6 40 8 70 M188 182 q 6 40 -8 70" fill="none" stroke="#2b2118" stroke-width="1.4"/>

    <!-- 말풍선 같은 낙관 -->
    <rect x="24" y="22" width="30" height="30" rx="3" fill="#b23a2e" stroke="none"/>
    <text x="39" y="35" text-anchor="middle" font-family="Noto Serif KR, serif" font-size="11" fill="#f6efe0" stroke="none" font-weight="700">觀</text>
    <text x="39" y="48" text-anchor="middle" font-family="Noto Serif KR, serif" font-size="11" fill="#f6efe0" stroke="none" font-weight="700">相</text>
  </g>
</svg>
