name: Deploy Supabase (DB + 함수)

# 저장소 Secrets 에 SUPABASE_ACCESS_TOKEN 이 있을 때만 돈다. docs/결제-연결.md
on:
  push:
    branches: [claude/trusting-cannon-b5hfx8]
    paths: ['supabase/**', 'src/lib/narrative.js', '.github/workflows/supabase.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: 설정 확인
        id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "Supabase 연결값이 없어 건너뜀 (docs/결제-연결.md)"; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: 22
      - run: node scripts/sync-functions.mjs
        if: steps.ready.outputs.go == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.ready.outputs.go == 'true'
        with:
          version: latest
      - name: 프로젝트 연결 · 표 만들기
        if: steps.ready.outputs.go == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push
      - name: 함수 비밀값
        if: steps.ready.outputs.go == 'true'
        env:
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRICE: ${{ vars.PRICE || '990' }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || 'https://serioussnape.github.io' }}
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            TOSS_SECRET_KEY="$TOSS_SECRET_KEY" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            PRICE="$PRICE" ALLOWED_ORIGINS="$ALLOWED_ORIGINS"
      - name: 함수 배포
        if: steps.ready.outputs.go == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"
